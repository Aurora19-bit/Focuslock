name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configure AndroidX, Structure, and Build
      run: |
        # 1. Enable AndroidX in gradle.properties
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.nonTransitiveRClass=true" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties

        # 2. Build directory layout
        mkdir -p app/src/main/java/com/vidhya/focuslock
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/xml

        # 3. Move Kotlin sources
        mv AppListAdapter.kt BlockActivity.kt BootReceiver.kt FocusAccessibilityService.kt \
           MainActivity.kt MathPuzzleActivity.kt SessionAdminReceiver.kt SessionManager.kt \
           SessionTimerService.kt app/src/main/java/com/vidhya/focuslock/ 2>/dev/null || true

        # 4. Move Layouts
        mv activity_block.xml activity_main.xml activity_puzzle.xml item_app.xml \
           app/src/main/res/layout/ 2>/dev/null || true

        # 5. Move Resources
        mv strings.xml themes.xml colors.xml \
           app/src/main/res/values/ 2>/dev/null || true

        # 6. Move XML Configs
        mv accessibility_service_config.xml device_admin_receiver.xml \
           app/src/main/res/xml/ 2>/dev/null || true

        # 7. Move Manifest
        mv AndroidManifest.xml app/src/main/ 2>/dev/null || true

        # 8. Create app-level build configuration
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.vidhya.focuslock"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.vidhya.focuslock"
                minSdk = 24
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
            }

            buildTypes {
                release {
                    isMinifyEnabled = false
                }
            }

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
        }

        dependencies {
            implementation("androidx.core:core-ktx:1.13.1")
            implementation("androidx.appcompat:appcompat:1.7.0")
            implementation("com.google.android.material:material:1.12.0")
            implementation("androidx.constraintlayout:constraintlayout:2.1.4")
        }
        EOF

        # 9. Build with Gradle 8.7
        gradle wrapper --gradle-version 8.7
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FocusLock-APK
        path: "app/build/outputs/apk/debug/*.apk"
        
