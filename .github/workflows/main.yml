name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Debug APK
      run: |
        # 1. Find where settings.gradle or settings.gradle.kts is located
        SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle*" | head -n 1)
        TARGET_DIR=$(dirname "$SETTINGS_FILE")
        
        echo "Found Android project inside: $TARGET_DIR"
        cd "$TARGET_DIR"

        # 2. Generate Gradle wrapper if missing
        if [ ! -f "gradlew" ]; then
          gradle wrapper --gradle-version 8.7
        fi
        
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FocusLock-APK
        path: "**/build/outputs/apk/debug/*.apk"
        
